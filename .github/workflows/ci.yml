name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # ratchet:Swatinem/rust-cache@v2

      - run: rustup target add wasm32-unknown-unknown
      - name: install tools
        uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # ratchet:taiki-e/install-action@v2
        with:
          tool: trunk@0.17

      - name: Build
        run: cargo build --workspace --all-features
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-features -- -D warnings
      - name: Build docs
        run: cargo doc --document-private-items --workspace --all-features --no-deps
      - name: Build web
        run: trunk build web/index.html
    env:
      RUSTDOCFLAGS: -Dwarnings
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # ratchet:Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test

  alls-green:
    # I hate github actions.
    # A default status check of success() is applied unless you include another status check function, like always().
    # https://docs.github.com/en/actions/learn-github-actions/expressions#status-check-functions
    # https://stackoverflow.com/questions/58858429/how-to-run-a-github-actions-step-even-if-the-previous-step-fails-while-still-f

    if: always()
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # ratchet:re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
